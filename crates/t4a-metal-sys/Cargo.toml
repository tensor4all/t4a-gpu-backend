[package]
name = "t4a-metal-sys"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true
description = "Run-time loaded Metal, MetalPerformanceShaders and MetalPerformanceShadersGraph tables for tensor4all"
readme = "README.md"
keywords = ["metal", "apple", "gpu", "tensor4all"]
categories = ["hardware-support", "external-ffi-bindings"]

[dependencies]
thiserror = "2"

# Only the macOS dynamic loader calls `dlopen`/`dlsym`/`dlerror`.
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
