[package]
name = "t4a-hip-sys"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true
description = "Run-time loaded HIP, rocBLAS and rocSOLVER function tables for tensor4all"
readme = "README.md"
keywords = ["hip", "rocm", "amd", "gpu", "tensor4all"]
categories = ["hardware-support", "external-ffi-bindings"]

[dependencies]
thiserror = "2"

# Only the Linux dynamic loader calls `dlopen`/`dlsym`/`dladdr`/`dlerror`.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
