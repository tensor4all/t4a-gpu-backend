[workspace]
members = [
    "crates/t4a-cuda-runtime",
    "crates/t4a-metal-sys",
    "crates/t4a-metal-runtime",
    "crates/t4a-hip-sys",
    "crates/t4a-hip-runtime",
    "crates/t4a-hip-kernels",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tensor4all/t4a-gpu-backend"
authors = ["Hiroshi Shinaoka <h.shinaoka@gmail.com>", "tensor4all contributors"]
rust-version = "1.75"

[profile.release]
debug = 0
